<div id="porta" class="container estreito oculto">
  <form id="form-pin" class="cartao">
    <h2>Acesso da equipe</h2>
    <p class="sub">Digite o PIN para continuar.</p>
    <label for="pin">PIN</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" required>
    <button class="primario grande" type="submit">Entrar</button>
    <div id="erro-pin" class="aviso erro oculto"></div>
  </form>
</div>
